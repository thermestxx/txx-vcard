<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>TrAxxion — François Styga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --yellow: #ffca0a;
      --yellow-hover: #f0bb00;
      --blue: #005bbb;
      --dark: #1a1a1a;
      --muted: #999;
      --border: #ebebeb;
      --bg: #f9f9f9;
      --card-bg: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(2.5rem, 7vw, 5rem) clamp(1.25rem, 5vw, 3rem);
    }

    /* ── LOGO ── */
    .logo {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -0.01em;
      margin-bottom: clamp(2.5rem, 6vw, 4rem);
      text-align: center;
      color: var(--dark);
      text-decoration: none;
    }
    .logo .a { color: var(--blue); }

    /* ── CARD ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2.5rem 2.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .card-name {
      font-weight: 800;
      font-size: clamp(1.6rem, 5vw, 2rem);
      color: var(--dark);
      line-height: 1.2;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.6rem;
      background: var(--yellow);
      color: var(--dark);
      text-decoration: none;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 999px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-download:hover {
      background: var(--yellow-hover);
      transform: translateY(-1px);
    }
    .btn-download svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ── BACK LINK ── */
    .back {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      color: #ccc;
      text-decoration: none;
      transition: color 0.15s;
    }
    .back:hover { color: var(--muted); }

    /* ── FOOTER ── */
    footer {
      margin-top: auto;
      padding-top: clamp(2.5rem, 6vw, 4rem);
      font-size: 0.78rem;
      color: #bbb;
      text-align: center;
      line-height: 1.7;
    }
    footer a { color: #bbb; text-decoration: none; }
    footer a:hover { color: var(--dark); }
  </style>
</head>
<body>

  <a class="logo" href="https://www.traxxion.eu" target="_blank" rel="noopener">
    Tr<span class="a">A</span>xxion S.A.
  </a>

  <div class="card">
    <div class="card-name">François Styga</div>
    <a class="btn-download" href="https://thermestxx.github.io/txx-vcard/francois-styga.vcf">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-6.707a1 1 0 011.414 0L9 11.586V3a1 1 0 112 0v8.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
      Save Contact
    </a>
  </div>

  <a class="back" href="index.html">← All contacts</a>

  <footer>
    12 rue de Flaxweiler · L-6776 Grevenmacher · Luxembourg<br />
    <a href="https://www.traxxion.eu" target="_blank" rel="noopener">www.traxxion.eu</a>
  </footer>

</body>
</html>
